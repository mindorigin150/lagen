<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAGEN Simulator Trace Review</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f0e8;
      --raised: #fffdf9;
      --ink: #2d2523;
      --muted: #746864;
      --plum: #532f4f;
      --coral: #d9654f;
      --rule: #d8cec3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    header { max-width: 1180px; margin: 0 auto; padding: 54px 22px 28px; }
    .kicker { margin: 0; color: var(--coral); font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 8px 0 14px; color: var(--plum); font: 500 clamp(38px, 7vw, 72px)/1 Georgia, serif; letter-spacing: -.04em; }
    .intro { max-width: 860px; margin: 0; color: var(--muted); font-size: 16px; }
    .counts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 25px; padding-block: 14px; border-block: 1px solid var(--rule); }
    .counts strong { color: var(--coral); font-size: 20px; }
    nav { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; padding: 12px; border-block: 1px solid var(--rule); background: rgb(245 240 232 / 94%); backdrop-filter: blur(10px); }
    button { border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--muted); padding: 9px 16px; font: inherit; cursor: pointer; }
    button.active { background: var(--plum); color: white; }
    main { max-width: 1180px; margin: 0 auto; padding: 34px 22px 70px; }
    .group-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; padding-bottom: 13px; border-bottom: 1px solid var(--rule); }
    .group-heading h2 { margin: 0; font: 500 31px/1.1 Georgia, serif; }
    .group-heading p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .pair-grid { display: grid; gap: 22px; }
    .pair { border: 1px solid var(--rule); border-radius: 14px; padding: 13px; }
    .pair-heading { display: flex; align-items: baseline; justify-content: space-between; padding: 1px 2px 12px; }
    .pair-heading h3 { margin: 0; color: var(--plum); }
    .pair-heading span { color: var(--muted); font-size: 11px; }
    .pair-candidates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    article { overflow: hidden; border: 1px solid var(--rule); border-radius: 12px; background: var(--raised); box-shadow: 0 5px 18px rgb(45 37 35 / 7%); }
    .title { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 15px 10px; }
    .title div { display: flex; align-items: baseline; gap: 8px; }
    .title h3 { margin: 0; color: var(--plum); }
    .title > span { color: var(--muted); font-size: 12px; }
    .variant { color: var(--coral); font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    video { display: block; width: 100%; height: auto; max-height: 460px; background: #000; }
    dl { display: grid; gap: 8px; margin: 0; padding: 15px; }
    dl div { display: grid; grid-template-columns: 105px minmax(0, 1fr); gap: 10px; }
    dt { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    dd { margin: 0; color: #5f5450; font-size: 13px; overflow-wrap: anywhere; }
    .outcome { color: var(--plum); font-weight: 700; }
    @media (max-width: 760px) {
      header { padding-top: 36px; }
      nav { justify-content: flex-start; overflow-x: auto; }
      .grid, .pair-candidates { grid-template-columns: 1fr; }
      .group-heading, .pair-heading { align-items: flex-start; flex-direction: column; }
      dl div { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">Internal candidate review</p>
    <h1>Simulator trace gallery</h1>
    <p class="intro">所有可见游戏状态均由 simulator 逐步生成。Flappy Bird 从真实 fixed-L3 rollout 重建初始化状态，再用一个手写请求比较 Latency 0 和 Latency 5；Demon Attack 将 mock fork 与同 episode、seed、fork 和时间窗口的真实策略 replay 并排展示，Deadly Corridor 只展示 Latency 0 存活、Latency 6 死亡的 mock fork。</p>
    <div class="counts" id="counts"></div>
  </header>
  <nav id="tabs" aria-label="按游戏筛选"></nav>

    <div class="group-heading">
      <h2 id="game-title"></h2>
      <p id="latency-label"></p>
    </div>
    <section id="gallery"></section>

  <script>
    const candidates = JSON.parse(document.querySelector('#candidate-data').textContent);
    const games = [
      { id: 'flappy', label: 'Flappy Bird', latency: 5 },
      { id: 'demon_attack', label: 'Demon Attack', latency: 6 },
      { id: 'deadly_corridor', label: 'Deadly Corridor', latency: 6 },
    ];
    const counts = document.querySelector('#counts');
    const tabs = document.querySelector('#tabs');
    const gallery = document.querySelector('#gallery');
    const gameTitle = document.querySelector('#game-title');
    const latencyLabel = document.querySelector('#latency-label');

    function variantLabel(variant) {
      return variant === 'mock' ? 'Hand-authored fork' : 'Recorded policy replay';
    }

    function sourceLabel(source) {
      return source === 'hand_authored' ? 'hand-authored' : 'actions.jsonl';
    }

    function requestsLabel(requests) {
      const shown = requests.slice(0, 8).map((request) => `t${request.tick} ${request.action}`).join(' · ');
      return requests.length > 8 ? `${shown} · +${requests.length - 8} more` : shown;
    }

    function candidateCard(candidate) {
      const card = document.createElement('article');
      card.innerHTML = `
        <div class="title"><div><h3>${candidate.id}</h3><span class="variant">${variantLabel(candidate.variant)}</span></div><span>${candidate.duration.toFixed(1)} s · ${candidate.frames} frames</span></div>
        <video src="${candidate.video}" poster="${candidate.poster}" controls muted loop playsinline preload="metadata"></video>
        <dl>
          <div><dt>Source</dt><dd>episode ${candidate.sourceEpisode}, seed ${candidate.seed}</dd></div>
          <div><dt>Frames</dt><dd>start ${candidate.clipStartRawFrame}, fork ${candidate.forkRawFrame}</dd></div>
          <div><dt>Requests</dt><dd>${requestsLabel(candidate.requests)}</dd></div>
          <div><dt>Request source</dt><dd>${sourceLabel(candidate.requestSource)}</dd></div>
          <div><dt>Playback</dt><dd>${candidate.stateFps} state FPS · ${candidate.encodedFps} FPS encoded</dd></div>
          <div><dt>Outcome</dt><dd class="outcome">${candidate.outcome}</dd></div>
        </dl>`;
      return card;
    }

    function renderGame(game) {
      tabs.querySelectorAll('button').forEach((button) => {
        button.classList.toggle('active', button.dataset.game === game.id);
      });
      gallery.querySelectorAll('video').forEach((video) => video.pause());
      gameTitle.textContent = game.label;
      latencyLabel.textContent = `Latency 0 vs Latency ${game.latency}`;
      gallery.replaceChildren();
      const selected = candidates.filter((candidate) => candidate.game === game.id);
      if (game.id === 'flappy' || game.id === 'deadly_corridor') {
        gallery.className = 'grid';
        selected.forEach((candidate) => gallery.append(candidateCard(candidate)));
        return;
      }
      gallery.className = 'pair-grid';
      [...new Set(selected.map((candidate) => candidate.pairId))].forEach((pairId) => {
        const pair = document.createElement('section');
        pair.className = 'pair';
        pair.innerHTML = `<div class="pair-heading"><h3>${pairId}</h3><span>same source · same fork · same window</span></div>`;
        const pairCandidates = document.createElement('div');
        pairCandidates.className = 'pair-candidates';
        selected.filter((candidate) => candidate.pairId === pairId)
          .sort((left, right) => left.variant === right.variant ? 0 : left.variant === 'mock' ? -1 : 1)
          .forEach((candidate) => pairCandidates.append(candidateCard(candidate)));
        pair.append(pairCandidates);
        gallery.append(pair);
      });
    }

    games.forEach((game) => {
      const count = candidates.filter((candidate) => candidate.game === game.id).length;
      const summary = document.createElement('span');
      summary.innerHTML = `<strong>${count}</strong> ${game.label}`;
      counts.append(summary);
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.dataset.game = game.id;
      tab.textContent = game.label;
      tab.addEventListener('click', () => renderGame(game));
      tabs.append(tab);
    });
    renderGame(games[0]);
  </script>
